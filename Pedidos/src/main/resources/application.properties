spring.application.name=Pedidos
server.port=8082

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/smartlogix_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=grupo-pedidos
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# JWT
jwt.secret=smartlogix-secret-key-hmac-sha256
jwt.expiration=900000

# gRPC
grpc.inventory.host=localhost
grpc.inventory.port=9090

# Resilience4J
resilience4j.circuitbreaker.instances.inventario.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventario.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventario.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventario.permitted-number-of-calls-in-half-open-state=3

# Logging
logging.level.root=INFO
logging.level.com.smartlogix.pedidos=DEBUG
logging.level.org.springframework.web=DEBUG
