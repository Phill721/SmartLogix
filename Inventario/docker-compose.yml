version: '3.8'

services:
  db_inventario:
    image: mysql:8.0
    container_name: db_inventario
    environment:
      MYSQL_DATABASE: smartlogix_inventario
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306" # Docker mapea el puerto interno 3306 al externo 3307 de tu Windows
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: inventario-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: inventario-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1